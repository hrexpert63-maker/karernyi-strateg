name: Публикация эфиров клуба «Ресурс»

on:
  schedule:
    # Эфир в 10:00 МСК (07:00 UTC) по воскресеньям; запись появляется позже.
    # Окно ~08:00–21:00 UTC, каждые 20 минут, воскресенье и понедельник.
    - cron: "*/20 8-20 * * 0,1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Пробный запуск: только показать, что нашлось, ничего не публиковать"
        type: boolean
        default: true

concurrency:
  group: resurs-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: resurs-publisher/requirements.txt
      - run: pip install -r resurs-publisher/requirements.txt
      - name: Свободное место
        run: df -h /home/runner /tmp
      - name: Публикация
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          START_DATE: ${{ vars.START_DATE || '2026-10-11' }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          TG_VIDEO_BOT_TOKEN: ${{ secrets.TG_VIDEO_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_NOTIFY_CHAT_ID: ${{ secrets.TG_NOTIFY_CHAT_ID }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
        run: python -I resurs-publisher/publisher.py
